/**:
  ros__parameters:
    feature_extract_enable: false
    point_filter_num: 2
    max_iteration: 5
    filter_size_surf: 0.05
    filter_size_map: 0.05
    cube_side_length: 200.0
    runtime_pos_log_enable: false
    # Legacy save path; pcd_save.pcd_save_path below takes precedence.
    map_file_path: ""
    common:
      lid_topic: /livox/lidar
      imu_topic: /livox/imu
      pointcloud2: true
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0
    preprocess:
      # Gazebo's ray sensor publishes standard x/y/z/intensity PointCloud2.
      lidar_type: 0
      scan_line: 32
      blind: 0.10
      timestamp_unit: 3
      scan_rate: 10
    mapping:
      acc_cov: 1.0
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 70.0
      # Simulated lidar and IMU share the mid360_link origin and axes. The
      # physical mount relative to base_link is represented by the virtual TF.
      extrinsic_est_en: false
      extrinsic_T: [0.0, 0.0, 0.0]
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]
    publish:
      path_en: true
      effect_map_en: false
      map_en: false
      scan_publish_en: true
      dense_publish_en: true
      scan_bodyframe_pub_en: true
    pcd_save:
      pcd_save_en: false
      pcd_save_path: "/home/alice/rc_2027/cloud_localization/src/robocon_cloud_localization/maps/mid360_sim_2.pcd"
      # -1: save on normal shutdown; N > 0: also save every N processed scans.
      # At 10 Hz, interval: 100 checkpoints approximately every 10 seconds.
      interval: -1
